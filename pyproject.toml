[project]
name = "tkv"
version = "0.1.0"
description = "TikTok Knowledge Vault - ingest TikTok channels into an AI-queryable Obsidian vault"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "yt-dlp>=2024.4.9",
    "anthropic>=0.40",
    "requests>=2.31",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8.0"]

[project.scripts]
tkv = "tkv.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tkv*"]
